# Renders the documentation site in doc/ and publishes it to GitHub Pages (gh-pages branch)
# on every push to main. Enable Pages for the gh-pages branch once in the repository settings.
name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: doc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
